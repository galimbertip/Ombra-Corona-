<!DOCTYPE html>
<!-- GPverse — Ombra & Corona — la versione corrente è in js/version.js -->
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14110f">
  <meta name="description" content="Ombra & Corona — RTS GPverse in un mondo fantasy dal sapore tolkieniano">
  <title>Ombra & Corona · GPverse</title>
  <link rel="icon" href="assets/sprites/emblem.webp" type="image/webp">
  <link rel="alternate icon" href="assets/icon.svg" type="image/svg+xml">
  <!-- Versione della build: va aggiornata insieme a js/version.js. Serve a non far mescolare
       al browser file vecchi e nuovi dopo un aggiornamento (GitHub Pages tiene i file in cache). -->
  <script>
    window.BUILD = 'V.0.10.0';
    (function () {
      var v = '?v=' + window.BUILD;
      var mods = ['main', 'version', 'config', 'assets', 'world', 'entities', 'game', 'ai', 'maps', 'territory', 'seasons', 'creatures', 'campaign'];
      var map = { imports: {} };
      mods.forEach(function (m) { map.imports['./js/' + m + '.js'] = './js/' + m + '.js' + v; });
      map.imports['./lib/three.module.js'] = './lib/three.module.js' + v;
      map.imports['./lib/three.core.js'] = './lib/three.core.js' + v;
      var s = document.createElement('script'); s.type = 'importmap'; s.textContent = JSON.stringify(map);
      document.currentScript.after(s);
      document.write('<link rel="stylesheet" href="css/style.css' + v + '">');
    })();
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="selbox" hidden></div>
  <div id="toast"></div>
  <div id="banner"></div>

  <!-- HUD di gioco -->
  <div id="hud" hidden>
    <aside id="objBox" hidden><b id="objTitle"></b><ul id="objList"></ul></aside>
    <header id="topbar">
      <div id="res"></div>
      <div class="right">
        <span id="era" title="Era attuale">Prima Era</span>
        <span id="season" title="Stagione e tempo rimasto"></span>
        <span id="crownInfo" hidden title="Corona d'Ombra: clic per trovarla"></span>
        <span id="clock">0:00</span>
        <button class="version-badge" title="Storia delle versioni"></button>
        <button id="menuBtn" title="Pausa">☰</button>
      </div>
    </header>
    <div id="camBtns">
      <button id="rotL" title="Ruota a sinistra (Q)">⟲</button>
      <button id="rotR" title="Ruota a destra (E)">⟳</button>
      <button id="heroBtn" title="Eroe (R)">👑</button>
      <button id="idleBtn" title="Contadino inattivo (punto)">⛏<span id="idleCount"></span></button>
      <button id="zoomIn" title="Avvicina">＋</button>
      <button id="zoomOut" title="Allontana">－</button>
      <button id="boxBtn" title="Selezione a riquadro">▢</button>
    </div>
    <footer id="bottom">
      <canvas id="minimap" width="160" height="160"></canvas>
      <div id="panel"></div>
    </footer>
  </div>

  <!-- Schermata iniziale -->
  <section id="start" class="screen">
    <div class="card">
      <img class="emblem" src="assets/sprites/emblem.webp" alt="">
      <p class="brand">GPverse</p>
      <h1>Ombra <span>&</span> Corona</h1>
      <p class="tag">Uomini, Elfi, Nani e l'Ombra si contendono il Mondo di Mezzo</p>
      <div class="menu">
        <button id="play" class="primary">Partita libera</button>
        <button id="campBtn" disabled>Campagna <small>Quattro popoli · 17 missioni</small></button>
        <div id="factionPick" class="faction-pick"></div>
        <label>Avversario
          <select id="enemySel"></select>
        </label>
        <label>Mappa
          <select id="mapSel"></select>
        </label>
        <p id="mapDesc" class="map-desc"></p>
        <label>Difficoltà
          <select id="difficulty">
            <option value="easy">Facile</option>
            <option value="normal" selected>Normale</option>
            <option value="hard">Difficile</option>
          </select>
        </label>
        <button id="historyBtn">Storia delle versioni <span id="newBadge" class="new" hidden>Nuovo!</span></button>
      </div>
      <p id="stats"></p>
      <p class="foot"><button class="version-badge" title="Storia delle versioni"></button> · scegli la tua fazione e conquista la mappa</p>
    </div>
  </section>

  <!-- Campagna (V.0.9.0) -->
  <section id="campaign" class="screen" hidden>
    <div class="card">
      <p class="brand">Campagna</p>
      <div id="campTabs" class="camp-tabs"></div>
      <h2 id="campTitle"></h2>
      <p id="campDesc" class="map-desc"></p>
      <div id="missionList" class="missions"></div>
      <div class="menu"><button id="campBack">Indietro</button></div>
    </div>
  </section>

  <!-- Racconto della missione -->
  <section id="briefing" class="screen" hidden>
    <div class="card">
      <p class="brand" id="briefPlace"></p>
      <h2 id="briefTitle"></h2>
      <div id="briefText" class="brief"></div>
      <h3>Obiettivi</h3>
      <ul id="briefObj" class="obj"></ul>
      <div class="menu">
        <button id="briefGo" class="primary">Inizia la missione</button>
        <button id="briefBack">Indietro</button>
      </div>
    </div>
  </section>

  <!-- Pausa -->
  <section id="pause" class="screen" hidden>
    <div class="card small">
      <h2>Pausa</h2>
      <p id="mapInfo" class="map-desc"></p>
      <div class="menu">
        <button id="resume" class="primary">Riprendi</button>
        <button id="quit">Torna al menu</button>
      </div>
    </div>
  </section>

  <!-- Fine partita -->
  <section id="over" class="screen" hidden>
    <div class="card small">
      <h2 id="overTitle"></h2>
      <p id="overText"></p>
      <div class="menu">
        <button id="nextMission" class="primary" hidden>Missione successiva</button>
        <button id="again" class="primary">Rigioca</button>
        <button id="toMenu">Menu</button>
      </div>
    </div>
  </section>

  <!-- Storia delle versioni -->
  <dialog id="history">
    <header><h2>Storia di Ombra & Corona</h2><button id="historyClose">✕</button></header>
    <div id="historyList"></div>
  </dialog>

  <script type="module">import './js/main.js';</script>
</body>
</html>
